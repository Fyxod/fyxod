<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I'm Parth</title>
  <desc id="desc">Parth Katiyar, software engineer building backend systems, AI and LLM products, and developer tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#11103a"/>
      <stop offset="1" stop-color="#260b36"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.48" stop-color="#00bbf9"/>
      <stop offset="1" stop-color="#f15bb5"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#f15bb5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f15bb5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8b93ff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="70" cy="300" r="260" fill="url(#cyanGlow)"/>
  <circle cx="1110" cy="30" r="280" fill="url(#pinkGlow)"/>

  <g opacity="0.6">
    <circle cx="87" cy="62" r="4" fill="#00f5d4"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="111" cy="62" r="4" fill="#00bbf9"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="135" cy="62" r="4" fill="#f15bb5"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="78" y="146" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">HEY, I'M PARTH.</text>
  <rect x="80" y="168" width="570" height="7" rx="3.5" fill="url(#neon)" filter="url(#glow)"/>
  <text x="80" y="222" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">I build backend systems, AI/LLM products, and developer tools.</text>

  <g transform="translate(80 264)" font-family="Consolas,SFMono-Regular,monospace" font-size="15" font-weight="700">
    <text x="0" y="20" fill="#00f5d4">BACKEND SYSTEMS</text>
    <text x="145" y="20" fill="#64748b">/</text>
    <text x="167" y="20" fill="#00bbf9">AI + LLMS</text>
    <text x="260" y="20" fill="#64748b">/</text>
    <text x="282" y="20" fill="#f15bb5">DEVELOPER TOOLS</text>
  </g>

  <g transform="translate(790 60)" filter="url(#shadow)">
    <rect width="330" height="222" rx="18" fill="#090d1a" stroke="#5361ff" stroke-opacity="0.55"/>
    <path d="M0 46H330" stroke="#334155"/>
    <circle cx="22" cy="23" r="5" fill="#ff5f56"/>
    <circle cx="41" cy="23" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="23" r="5" fill="#27c93f"/>
    <g font-family="Consolas,SFMono-Regular,monospace" font-size="16">
      <text x="24" y="84" fill="#00f5d4">$</text>
      <text x="45" y="84" fill="#e2e8f0">whoami</text>
      <text x="24" y="119" fill="#64748b">›</text>
      <text x="45" y="119" fill="#f15bb5">software engineer</text>
      <text x="24" y="149" fill="#64748b">›</text>
      <text x="45" y="149" fill="#00bbf9">backend + AI</text>
      <text x="24" y="179" fill="#64748b">›</text>
      <text x="45" y="179" fill="#00f5d4">always building</text>
      <rect x="24" y="196" width="10" height="3" fill="#f8fafc">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <path d="M36 316H1164" stroke="url(#neon)" stroke-opacity="0.5"/>
</svg>
