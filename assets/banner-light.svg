<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I'm Parth</title>
  <desc id="desc">Parth Katiyar, software engineer building backend systems, AI and LLM products, and developer tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="0.52" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9f8c"/>
      <stop offset="0.48" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#f15bb5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f15bb5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#475569" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#64748b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="70" cy="300" r="260" fill="url(#cyanGlow)"/>
  <circle cx="1110" cy="30" r="280" fill="url(#pinkGlow)"/>

  <g opacity="0.75">
    <circle cx="87" cy="62" r="4" fill="#0f9f8c"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="111" cy="62" r="4" fill="#0284c7"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="135" cy="62" r="4" fill="#db2777"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="78" y="146" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2.5">HEY, I'M PARTH.</text>
  <rect x="80" y="168" width="570" height="7" rx="3.5" fill="url(#neon)"/>
  <text x="80" y="222" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600">I build backend systems, AI/LLM products, and developer tools.</text>

  <g transform="translate(80 264)" font-family="Consolas,SFMono-Regular,monospace" font-size="15" font-weight="700">
    <text x="0" y="20" fill="#0f9f8c">BACKEND SYSTEMS</text>
    <text x="145" y="20" fill="#94a3b8">/</text>
    <text x="167" y="20" fill="#0284c7">AI &amp; LLMS</text>
    <text x="260" y="20" fill="#94a3b8">/</text>
    <text x="282" y="20" fill="#db2777">DEVELOPER TOOLS</text>
  </g>

  <g transform="translate(790 60)" filter="url(#shadow)">
    <rect width="330" height="222" rx="18" fill="#ffffff" stroke="#818cf8" stroke-opacity="0.55"/>
    <path d="M0 46H330" stroke="#e2e8f0"/>
    <circle cx="22" cy="23" r="5" fill="#ff5f56"/>
    <circle cx="41" cy="23" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="23" r="5" fill="#27c93f"/>
    <g font-family="Consolas,SFMono-Regular,monospace" font-size="16">
      <text x="24" y="84" fill="#0f9f8c">$</text>
      <text x="45" y="84" fill="#0f172a">whoami</text>
      <text x="24" y="119" fill="#94a3b8">›</text>
      <text x="45" y="119" fill="#db2777">software engineer</text>
      <text x="24" y="149" fill="#94a3b8">›</text>
      <text x="45" y="149" fill="#0284c7">backend + AI</text>
      <text x="24" y="179" fill="#94a3b8">›</text>
      <text x="45" y="179" fill="#0f9f8c">always building</text>
      <rect x="24" y="196" width="10" height="3" fill="#0f172a">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <path d="M36 316H1164" stroke="url(#neon)" stroke-opacity="0.4"/>
</svg>
